apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gs-app
  labels:
    app: go-gs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-gs-app
  template:
    metadata:
      labels:
        app: go-gs-app
    spec:
      containers:
      - name: go-gs-app
        image: go-gs-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1323
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 1323
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 1323
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: go-gs-app-service
  labels:
    app: go-gs-app
spec:
  selector:
    app: go-gs-app
  ports:
  - port: 80
    targetPort: 1323
    name: http
  type: ClusterIP